services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-laravel_esl}"
      DB_USERNAME: "${DB_USERNAME:-laravel_user}"
      DB_PASSWORD: "${DB_PASSWORD:-localdev}"
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_DATABASE:-laravel_esl}"
      POSTGRES_USER: "${DB_USERNAME:-laravel_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-localdev}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
