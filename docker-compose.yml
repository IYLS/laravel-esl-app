services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: "${APP_KEY:-}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-laravel_esl}"
      DB_USERNAME: "${DB_USERNAME:-laravel_user}"
      DB_PASSWORD: "${DB_PASSWORD:-localdev}"
    volumes:
      - app_key:/var/www/app-key
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(preg_match('/\\s(?:200|302)\\s/', @get_headers('http://127.0.0.1/login')[0] ?? '') === 1 ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_DATABASE:-laravel_esl}"
      POSTGRES_USER: "${DB_USERNAME:-laravel_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-localdev}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_key:
  postgres_data:
