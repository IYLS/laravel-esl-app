services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?Define APP_URL en .env.docker}"
      APP_KEY: "${APP_KEY:?Define APP_KEY en .env.docker}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:?Define DB_DATABASE en .env.docker}"
      DB_USERNAME: "${DB_USERNAME:?Define DB_USERNAME en .env.docker}"
      DB_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env.docker}"
      LOG_CHANNEL: stderr
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(preg_match('/\\s(?:200|302)\\s/', @get_headers('http://127.0.0.1/login')[0] ?? '') === 1 ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:?Define DB_DATABASE en .env.docker}"
      POSTGRES_USER: "${DB_USERNAME:?Define DB_USERNAME en .env.docker}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env.docker}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_storage:
  postgres_data:
