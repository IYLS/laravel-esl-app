services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "${APP_URL:-http://localhost:8001}"
      APP_KEY: "${APP_KEY:-}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-laravel_esl_dev}"
      DB_USERNAME: "${DB_USERNAME:-laravel_user}"
      DB_PASSWORD: "${DB_PASSWORD:-localdev}"
      LOG_CHANNEL: stderr
    command:
      - sh
      - -c
      - |
        set -eu
        rm -f bootstrap/cache/*.php
        composer install --no-interaction
        if [ -z "$APP_KEY" ]; then
          if [ ! -s /run/laravel/app-key ]; then
            php artisan key:generate --show --no-ansi > /run/laravel/app-key
          fi
          export APP_KEY="$(cat /run/laravel/app-key)"
        fi
        exec apache2-foreground
    volumes:
      - .:/var/www/html
      - dev_vendor:/var/www/html/vendor
      - dev_storage:/var/www/html/storage
      - dev_app_key:/run/laravel
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-laravel_esl_dev}"
      POSTGRES_USER: "${DB_USERNAME:-laravel_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-localdev}"
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  assets:
    build:
      context: .
      dockerfile: Dockerfile
      target: assets
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run watch-poll"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules

volumes:
  dev_vendor:
  dev_storage:
  dev_app_key:
  dev_postgres_data:
  dev_node_modules:
