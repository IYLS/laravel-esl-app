name: Deploy to production

on:
  push:
    branches: [main, feature/upgrade]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_BRANCH,APP_KEY,APP_URL,APP_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD
          script: |
            set -e
            cd /var/www/laravel-esl-app

            # Sincronizar antes de llamar a ci-deploy.sh: el script debe ser el del commit
            # que se despliega, no el que quedó en el servidor. Los cambios locales quedan
            # en git stash y el checkout funciona aunque la rama del servidor haya divergido.
            git fetch origin "$DEPLOY_BRANCH"
            git -c user.name=deploy -c user.email=deploy@localhost stash push --message "pre-deploy $(date -u +%FT%TZ)"
            git checkout -B "$DEPLOY_BRANCH" FETCH_HEAD

            cat > .env.docker <<EOF
            APP_NAME=laravel
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${APP_URL}
            APP_KEY=${APP_KEY}
            DB_CONNECTION=pgsql
            DB_HOST=db
            DB_PORT=5432
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            EOF

            sed -i 's/^[[:space:]]*//' .env.docker

            bash ci-deploy.sh
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
