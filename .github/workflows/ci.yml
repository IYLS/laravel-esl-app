name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: bash -n deploy.sh

      - name: Prepare environment
        run: |
          cat > .env <<EOF
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_URL=http://localhost:8000
          DB_DATABASE=laravel_esl_ci
          DB_USERNAME=laravel_ci
          DB_PASSWORD=laravel_ci_password
          EOF

      - name: Build and start application
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check PHP syntax
        run: |
          docker compose exec -T app bash -c '
            find app bootstrap config database routes tests -name "*.php" -print0 \
              | xargs -0 -P$(nproc) -n10 php -l > /dev/null
          '

      - name: Create storage link
        run: docker compose exec -T app php artisan storage:link

      - name: Check login page
        run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8000/login

      - name: Stop containers
        if: always()
        run: docker compose down
